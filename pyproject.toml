[project]
name = "tarnow-events"
version = "0.1.0"
description = "Aggregates events from Tarnów and a 50 km radius into live iCal feeds."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "icalendar>=6.0",
    "recurring-ical-events>=3.3",
    "feedparser>=6.0",
    "selectolax>=1.0",
    "rapidfuzz>=3.9",
    "PyYAML>=6.0",
    "python-dateutil>=2.9",
    "Unidecode>=1.3",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tarnow-events = "tarnow_events.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tarnow_events = ["web/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
