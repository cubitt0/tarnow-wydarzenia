server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    error_page 404 /404.html;

    types {
        text/html html;
        text/calendar ics;
        application/json json;
        application/xml xml;
        text/plain txt;
        application/javascript js;
        image/svg+xml svg;
        image/png png;
        image/x-icon ico;
    }

    location ~ \.ics$ {
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /state.json { deny all; }
}
