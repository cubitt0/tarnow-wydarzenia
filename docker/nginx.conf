server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    types {
        text/html html;
        text/calendar ics;
        application/json json;
    }

    location ~ \.ics$ {
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /state.json { deny all; }
}
