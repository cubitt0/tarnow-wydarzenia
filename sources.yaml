  # ─────────────────────────── TICKETING & AGGREGATORS ───────────────────────────
  - id: biletyna-tarnow
    name: Biletyna – Tarnów
    type: jsonld
    url: https://biletyna.pl/Tarnow
    group: bilety
    town: Tarnów
    priority: 40
  - id: allevents-tarnow
    name: allevents.in – Tarnów
    type: jsonld
    url: https://allevents.in/tarnow
    group: bilety
    priority: 30
    # The listing has dates only; event pages carry the start time.
    follow: 'allevents\.in/tarnow/[^/?#]+/\d{6,}$'
    max_follow: 60

  - id: ebilet
    name: eBilet – Tarnów i okolice
    type: ebilet
