*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--surface);color:var(--on-surface);font:400 14px/1.45 var(--font);-webkit-font-smoothing:antialiased;
  overflow-x:hidden;transition:background-color .3s var(--ease),color .3s var(--ease)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:8px}
.ms{font-family:"Material Symbols Rounded";font-weight:400;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;
  display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:"liga";font-variation-settings:"FILL" 0,"opsz" 20;user-select:none;flex:none}
.ms.f{font-variation-settings:"FILL" 1,"opsz" 20}
/* until the icon font is ready, hide ligature names so they never show as raw words */
html:not(.icons) .ms{color:transparent!important;width:1em;overflow:hidden}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1360px;margin:0 auto;padding:0 var(--gutter)}

/* state layer for interactive things */
.sl{position:relative;overflow:hidden;isolation:isolate}
.sl::after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .15s;pointer-events:none;z-index:3}
.sl:hover::after{opacity:.08}.sl:active::after{opacity:.12}

/* ---------- top app bar ---------- */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px) saturate(1.4);
  -webkit-backdrop-filter:blur(14px) saturate(1.4);transition:box-shadow .25s var(--ease)}
.bar.lifted{box-shadow:0 1px 0 var(--outline-var)}
.bar .wrap{display:flex;align-items:center;gap:8px;min-height:var(--bar-h)}
.brand{display:flex;align-items:center;gap:12px;min-width:0;margin-right:auto}
.logo{width:40px;height:40px;border-radius:12px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none}
.logo .ms{font-size:24px}
.brand h1{margin:0;font:800 22px/1.1 var(--font);font-stretch:85%;letter-spacing:-.2px;white-space:nowrap}
.brand small{display:block;color:var(--on-surface-var);font-size:12px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand>div{min-width:0}
.icon-btn{width:40px;height:40px;border-radius:20px;border:0;background:transparent;display:grid;place-items:center;color:var(--on-surface-var);flex:none}
.btn{height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--outline);background:transparent;color:var(--on-surface);font-weight:550;
  letter-spacing:.1px;display:inline-flex;align-items:center;gap:8px;flex:none;text-decoration:none;white-space:nowrap}
.btn .ms{font-size:18px}
.btn.tonal{border:0;background:var(--sec-c);color:var(--on-sec-c)}
.btn.filled{border:0;background:var(--primary);color:var(--on-primary)}
.btn.text{border:0;padding:0 12px}
.search{display:flex;align-items:center;gap:8px;height:44px;border-radius:22px;background:var(--surface-c-high);padding:0 6px 0 14px;
  width:min(380px,32vw);color:var(--on-surface-var);transition:background-color .2s,box-shadow .2s}
.search:focus-within{background:var(--surface-c-lowest);box-shadow:inset 0 0 0 2px var(--primary)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;font:inherit;font-size:15px;color:var(--on-surface)}
.search input::placeholder{color:var(--on-surface-var);opacity:.85}
.search input::-webkit-search-cancel-button{display:none}
.search .clr{width:32px;height:32px;visibility:hidden}
.search.has .clr{visibility:visible}
kbd{font:500 11px/1 var(--font);padding:3px 6px;border-radius:6px;border:1px solid var(--outline-var);color:var(--on-surface-var);background:var(--surface-c-low)}

/* segmented button */
.seg{display:inline-flex;border:1px solid var(--outline);border-radius:20px;height:40px;flex:none;overflow:hidden}
.seg button{border:0;background:transparent;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:550;
  color:var(--on-surface);transition:background-color .25s var(--ease),color .25s}
.seg button+button{border-left:1px solid var(--outline)}
.seg button[aria-pressed="true"]{background:var(--sec-c);color:var(--on-sec-c)}
.seg .chk{font-size:18px;width:0;opacity:0;margin-right:-6px;transition:width .25s var(--ease),opacity .2s,margin .25s var(--ease)}
.seg button[aria-pressed="true"] .chk{width:18px;opacity:1;margin-right:0}

/* ---------- date strip ---------- */
.strip{display:flex;align-items:stretch;gap:12px;padding:8px 0 4px}
.where{display:inline-flex;margin:4px 0 10px;border:1px solid var(--outline-var);border-radius:20px;overflow:hidden;max-width:100%}
.where button{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:0;background:transparent;color:var(--on-surface-var);
  font:600 13.5px/1 var(--font, inherit);cursor:pointer;white-space:nowrap;transition:background-color .2s,color .2s}
.where button+button{border-left:1px solid var(--outline-var)}
.where button .ms{font-size:18px}
.where button[aria-pressed="true"]{background:var(--on-surface);color:var(--surface)}
@media (max-width:860px){
  .toolbar{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
  .toolbar .where,.toolbar .seg{display:flex;width:100%}
  .toolbar .where button,.toolbar .seg button{flex:1;justify-content:center;padding:0 6px;font-size:13px}
  .toolbar .where button .ms{display:none}
  .when{border-radius:20px;padding:6px;margin:0 calc(-1 * var(--gutter) + 8px)}
  .controls .when .quick{display:none}  /* phones: the day tiles alone; Dziś/Jutro/Weekend only cost width */
  .when .days{margin:0!important;padding:2px!important}
  /* phones: one swipeable row, faded right edge says "there is more" */
  .controls .cats{flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gutter))!important;
    padding:2px var(--gutter) 8px!important;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
  .controls .cats::-webkit-scrollbar{display:none}
  .controls .cats.at-end{-webkit-mask-image:none;mask-image:none}
}
/* ---- scrollbars: thin, rounded, theme-coloured ---- */
html{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--on-surface) 28%,transparent) transparent}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--on-surface) 28%,transparent) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--on-surface) 24%,transparent);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--on-surface) 40%,transparent);border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-corner{background:transparent}

/* ---- controls: WHERE + VIEW / WHEN / WHAT, one left edge, one rhythm (12px) ---- */
.controls{display:grid;gap:12px;padding-top:12px;padding-bottom:4px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.toolbar .where{margin:0;height:40px;border-color:var(--outline);border-radius:20px}
.toolbar .where button{height:38px;padding:0 16px;font-size:14px;font-weight:550;color:var(--on-surface)}
.toolbar .where button+button{border-left-color:var(--outline)}
.toolbar .where button[aria-pressed="true"]{background:var(--sec-c);color:var(--on-sec-c)}
.when{display:flex;align-items:stretch;min-width:0;background:var(--surface-c-low);border-radius:24px;padding:8px}
.when .quick{display:flex;flex-direction:column;justify-content:center;gap:4px;flex:none;padding:0 8px 0 2px;margin-right:8px;
  border-right:1px solid var(--outline-var)}
.when .qchip{height:30px;width:100%;justify-content:flex-start;gap:6px;border-color:transparent;background:transparent;padding:0 12px 0 8px;border-radius:15px}
.when .qchip .ms{font-size:18px}
.when .qchip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.when .days{padding:2px;-webkit-mask-image:linear-gradient(90deg,#000 94%,transparent);mask-image:linear-gradient(90deg,#000 94%,transparent)}
.when .dchip{background:var(--surface)}
.cats{flex-wrap:wrap!important;gap:8px!important;padding:2px 0 8px!important;margin:0!important}
.cats .chip{flex:none}
.quick{display:flex;flex-direction:column;gap:6px;flex:none;justify-content:center}
.quick .row{display:flex;gap:6px}
.qchip{height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--outline-var);background:transparent;font-weight:600;color:var(--on-surface);
  display:inline-flex;align-items:center;gap:6px;transition:background-color .25s var(--ease),color .25s,border-color .25s;white-space:nowrap}
.qchip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.days{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding:4px 2px;
  mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 24px),transparent);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 24px),transparent)}
.days::-webkit-scrollbar{display:none}
.dchip{flex:1 1 0;max-width:96px;min-width:54px;scroll-snap-align:center;border:0;border-radius:18px;background:var(--surface-c-low);padding:8px 6px 9px;
  display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--on-surface);transition:background-color .25s var(--ease),color .25s,transform .25s var(--ease)}
.dchip:first-child{scroll-snap-align:start}
.dchip .dw{font-size:11px;font-weight:650;letter-spacing:.6px;text-transform:uppercase;color:var(--on-surface-var)}
.dchip .dn{font:800 24px/1 var(--font);font-stretch:80%;font-variant-numeric:tabular-nums;margin:2px 0}
.dchip .dc{font-size:11px;color:var(--on-surface-var);font-variant-numeric:tabular-nums;line-height:14px}
.dchip.we .dw{color:var(--ka-imprezy)}
.dchip.today .dw{color:inherit;font-weight:800}
.dchip.today:not(.on){box-shadow:inset 0 0 0 2px var(--primary)}
.mbar{display:flex;gap:1px;width:100%;height:5px;border-radius:3px;overflow:hidden;background:var(--surface-c-highest);margin-top:6px}
.mbar i{display:block;height:100%;background:var(--ka)}
.dchip.on{background:var(--primary);color:var(--on-primary)}
.dchip.on .dw,.dchip.on .dc{color:inherit;opacity:.85}
.dchip.on .mbar{box-shadow:0 0 0 1.5px var(--primary);background:var(--on-primary)}
.dchip.inrange:not(.on){background:var(--sec-c)}
.dchip.month-start{position:relative}
.dchip .mo{position:absolute;top:-1px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--on-surface-var)}

/* ---------- category chips ---------- */
.cats{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0 6px}
.chip{height:34px;border-radius:10px;border:1px solid var(--outline-var);background:transparent;padding:0 10px 0 8px;display:inline-flex;align-items:center;gap:6px;
  white-space:nowrap;font-weight:600;font-size:13.5px;color:var(--on-surface-var);flex:none;
  transition:background-color .25s var(--ease),color .25s,border-color .25s,filter .25s,opacity .25s}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--ka);filter:saturate(.25);opacity:.55;transition:all .25s var(--ease)}
.chip .chk{font-size:18px;width:0;margin-right:-6px;opacity:0;transition:width .25s var(--ease),opacity .2s,margin .25s var(--ease)}
.chip .n{font-size:11.5px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:10px;display:inline-grid;place-items:center;
  background:var(--surface-c-high);color:var(--on-surface-var);font-variant-numeric:tabular-nums}
.chip[aria-pressed="false"] .lbl{text-decoration:none;opacity:.8}
.chip[aria-pressed="true"]{background:var(--ka);border-color:var(--ka);color:var(--koa)}
/* Category icon instead of dot + check: filled chip = on, outlined + dimmed icon = off */
.chip .ci{font-size:18px;margin-left:2px;transition:color .2s,opacity .2s,font-variation-settings .2s;font-variation-settings:"FILL" 0}
.chip[aria-pressed="true"] .ci{font-variation-settings:"FILL" 1}
.chip[aria-pressed="false"] .ci{color:var(--ka);opacity:.75}
.chip[aria-pressed="true"] .dot{width:0;margin-right:-6px;opacity:0}
.chip[aria-pressed="true"] .chk{width:18px;margin-right:0;opacity:1}
.chip[aria-pressed="true"] .n{background:color-mix(in srgb,var(--koa) 22%,transparent);color:var(--koa)}
.chip.zero[aria-pressed="false"]{opacity:.55}
.chip.sep{margin-left:4px}

/* ---------- content head ---------- */
.head{display:flex;align-items:flex-end;gap:12px;padding:20px 0 12px;flex-wrap:wrap}
.head h2{margin:0;font:850 40px/1 var(--font);font-stretch:72%;letter-spacing:-.5px;text-transform:uppercase;min-width:0}
.head h2 .k{display:block;font:650 13px/1.2 var(--font);font-stretch:100%;letter-spacing:1.4px;color:var(--on-surface-var);margin-bottom:6px}
.head .meta{color:var(--on-surface-var);font-size:13px;padding-bottom:4px}
.head .nav{margin-left:auto;display:flex;align-items:center;gap:4px}

/* ---------- view host + transitions ---------- */
.host{position:relative;overflow:clip;min-height:50vh;padding-bottom:32px}
.view{will-change:transform,opacity}
.view.leaving{position:absolute;top:0;left:0;right:0;pointer-events:none}
.in-next{animation:inNext .42s var(--ease-dec) both}.in-prev{animation:inPrev .42s var(--ease-dec) both}
.out-next{animation:outNext .22s var(--ease-acc) both}.out-prev{animation:outPrev .22s var(--ease-acc) both}
.in-zoom{animation:inZoom .4s var(--ease-dec) both}.out-zoom{animation:outZoom .18s var(--ease-acc) both}
@keyframes inNext{from{transform:translateX(64px);opacity:0}}
@keyframes inPrev{from{transform:translateX(-64px);opacity:0}}
@keyframes outNext{to{transform:translateX(-48px);opacity:0}}
@keyframes outPrev{to{transform:translateX(48px);opacity:0}}
@keyframes inZoom{from{transform:scale(.97) translateY(8px);opacity:0}}
@keyframes outZoom{to{transform:scale(1.01);opacity:0}}
.stag{animation:cardIn .45s var(--ease-dec) both;animation-delay:calc(var(--i,0) * 28ms + 60ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}}

/* ---------- section titles ---------- */
.sec{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font:750 13px/1.2 var(--font);letter-spacing:1.2px;text-transform:uppercase;color:var(--on-surface-var)}
.sec .ms{font-size:18px}
.sec .cnt{font-weight:600;letter-spacing:0;text-transform:none;background:var(--surface-c-high);border-radius:10px;padding:2px 8px;font-size:12px}
.sec .line{flex:1;height:1px;background:var(--outline-var)}
.sec button{border:0;background:transparent;color:var(--on-surface-var);display:inline-flex;align-items:center;gap:4px;font:600 12.5px var(--font);
  letter-spacing:.2px;text-transform:none;padding:6px 10px;border-radius:16px}
.sec .exp{transition:transform .3s var(--ease)}
.sec.closed .exp{transform:rotate(-90deg)}
.dayhead{display:flex;align-items:baseline;gap:12px;margin:28px 0 12px;cursor:pointer;border:0;background:none;padding:0;text-align:left;color:inherit}
.dayhead b{font:850 26px/1 var(--font);font-stretch:75%;text-transform:uppercase;letter-spacing:-.2px}
.dayhead span{color:var(--on-surface-var);font-size:13px}
.dayhead .ms{color:var(--on-surface-var);align-self:center}

/* ---------- rails (all-day / multi-day / exhibitions) ---------- */
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;scrollbar-width:thin;scrollbar-color:var(--outline-var) transparent}
.slim{flex:0 0 268px;scroll-snap-align:start;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;text-align:left;
  border:0;border-radius:16px;background:var(--k);color:var(--ko);padding:10px 12px 10px 10px;min-height:76px;transition:transform .25s var(--ease),box-shadow .25s}
.slim:hover{transform:translateY(-2px);box-shadow:var(--shadow-1)}
.slim .th{width:52px;height:52px;border-radius:12px;background:var(--ka);color:var(--koa);display:grid;place-items:center;overflow:hidden;position:relative}
.slim .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slim .th .ms{font-size:24px}
.slim .tx{min-width:0;display:flex;flex-direction:column;gap:3px}
.slim .rng{align-self:flex-start;font-size:11.5px;font-weight:750;letter-spacing:.2px;padding:2px 8px;border-radius:8px;background:var(--ka);color:var(--koa);
  display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.slim .rng .ms{font-size:14px}
.slim b{font-weight:650;font-size:13.5px;line-height:17px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slim small{font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slim.x b{text-decoration:line-through}
.collapse{display:grid;grid-template-rows:1fr;transition:grid-template-rows .35s var(--ease)}
.collapse>div{min-height:0;overflow:hidden}
.collapse.closed{grid-template-rows:0fr}
.hint{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;border:1px dashed var(--outline-var);color:var(--on-surface-var);font-size:13px;margin-top:10px;flex-wrap:wrap}
.hint .btn{height:32px;padding:0 12px;margin-left:auto}

/* ---------- poster grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px}
.card{display:flex;flex-direction:column;align-items:stretch;min-width:0;text-align:left;border:0;padding:0;border-radius:20px;background:var(--surface-c-lowest);
  color:var(--on-surface);box-shadow:var(--shadow-1);transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-2)}
.card .media{position:relative;aspect-ratio:4/3;background:var(--k);color:var(--ko);overflow:hidden;border-radius:20px 20px 0 0;flex:none}
.card .media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease),opacity .4s}
.card:hover .media img{transform:scale(1.04)}
.card .media::before{content:"";position:absolute;inset:0;background:var(--img-scrim);z-index:1}
.card .lbl{position:absolute;top:10px;left:10px;z-index:2;display:inline-flex;align-items:center;gap:4px;padding:4px 9px 4px 7px;border-radius:9px;
  background:var(--k);color:var(--ko);font-size:11.5px;font-weight:700;letter-spacing:.2px;max-width:calc(100% - 20px)}
.card .lbl .ms{font-size:15px}
.card .tbig{position:absolute;left:12px;bottom:8px;z-index:2;color:#fff;font:850 30px/1 var(--font);font-stretch:75%;font-variant-numeric:tabular-nums;
  text-shadow:0 1px 8px rgb(0 0 0 / .4)}
.card .tbig .rng{font-size:24px;letter-spacing:-.2px}
.card .tbig small{font-size:15px;font-weight:600;opacity:.9;margin-left:2px}
/* text card: the media area becomes a bold colour block */
.card.txt .media{aspect-ratio:auto;min-height:92px;flex:1 0 92px;background:var(--ka);color:var(--koa);border-radius:20px 20px 0 0}
.card.txt .media::before{display:none}
.card.txt .media img{display:none}
.card.txt .tbig{color:var(--koa);text-shadow:none;bottom:10px;left:14px}
.card.txt .lbl{background:color-mix(in srgb,var(--koa) 18%,transparent);color:var(--koa)}
.card .glyph{position:absolute;right:-10px;bottom:-22px;font-size:120px;opacity:.16;display:none;font-variation-settings:"FILL" 1}
.card.txt .glyph{display:block}
.card .body{padding:12px 14px 12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.card h3{margin:0;font:700 16.5px/1.22 var(--font);font-stretch:92%;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card .place{display:flex;align-items:center;gap:4px;color:var(--on-surface-var);font-size:12.5px;min-width:0}
.card .place span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .place .ms{font-size:15px}
.foot{display:flex;align-items:center;gap:6px;margin-top:4px;color:var(--on-surface-var);font-size:12px;min-width:0}
.foot .sname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.foot .grow{flex:1}
.fav{width:16px;height:16px;border-radius:4px;flex:none;object-fit:contain;background:#fff}
.fav.av{display:inline-grid;place-items:center;background:var(--inverse);color:var(--on-inverse);font-size:10px;font-weight:800;text-transform:uppercase}
.nsrc{font-size:10.5px;font-weight:750;padding:1px 6px;border-radius:8px;background:var(--sec-c);color:var(--on-sec-c);flex:none}
.price{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:650;padding:2px 7px;border-radius:8px;background:var(--surface-c-high);
  color:var(--on-surface);white-space:nowrap;flex:none;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.price .ms{font-size:14px}
.price.free{background:var(--k-sport);color:var(--ko-sport)}
.rel{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--surface-c-high);color:var(--on-surface);align-self:flex-start}
.rel.now{background:var(--live);color:var(--on-live)}
.rel.now::before{content:"";width:6px;height:6px;border-radius:3px;background:currentColor;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.card.past{opacity:.62}
.card.past:hover{opacity:1}
.card.x h3{text-decoration:line-through;text-decoration-thickness:2px}
.xbadge{position:absolute;top:10px;right:10px;z-index:2;background:var(--live);color:var(--on-live);font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;letter-spacing:.4px}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;color:var(--on-surface-var);padding:48px 16px;border-radius:24px;background:var(--surface-c-low)}
.empty .ms{font-size:40px}

/* ---------- week ---------- */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0 10px}
.wd{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:14px;display:flex;align-items:baseline;gap:8px;color:var(--on-surface)}
.wd .dw{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--on-surface-var)}
.wd .dn{font:850 28px/1 var(--font);font-stretch:75%}
.wd .dc{margin-left:auto;font-size:11.5px;color:var(--on-surface-var)}
.wd.today{background:var(--primary);color:var(--on-primary)}
.wd.today .dw,.wd.today .dc{color:inherit;opacity:.85}
.wd.we .dw{color:var(--ka-imprezy)}.wd.today.we .dw{color:inherit}
.band{grid-column:1/-1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px 10px;padding:8px 0 10px;margin-bottom:8px;border-bottom:1px solid var(--outline-var)}
.bar-ev{border:0;min-width:0;height:28px;border-radius:9px;background:var(--k);color:var(--ko);font-size:12.5px;font-weight:600;padding:0 10px;
  display:flex;align-items:center;gap:6px;text-align:left;white-space:nowrap;overflow:hidden}
.bar-ev span{overflow:hidden;text-overflow:ellipsis}
.bar-ev .ms{font-size:15px}
.bar-ev.cl{border-top-left-radius:2px;border-bottom-left-radius:2px}
.bar-ev.cr{border-top-right-radius:2px;border-bottom-right-radius:2px}
.bar-ev i{width:4px;align-self:stretch;margin:6px 0;border-radius:2px;background:var(--ka);flex:none}
.band .more{font-size:12px;color:var(--on-surface-var);padding:4px 10px;grid-column:1/-1}
.wcol{display:flex;flex-direction:column;gap:8px;min-width:0;padding-top:4px}
.mini{border:0;padding:0;text-align:left;border-radius:14px;background:var(--surface-c-lowest);color:var(--on-surface);box-shadow:var(--shadow-1);
  overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:transform .25s var(--ease),box-shadow .25s}
.mini:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
.mini .thumb{height:72px;position:relative;background:var(--k);overflow:hidden}
.mini .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.mini .mb{padding:8px 10px 9px;border-left:4px solid var(--ka);display:flex;flex-direction:column;gap:2px}
.mini .tm{font:800 14px/1.1 var(--font);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.mini .tm .ms{font-size:15px;color:var(--ka)}
.mini b{font-weight:650;font-size:13px;line-height:16px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.mini small{font-size:11.5px;color:var(--on-surface-var);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.mini small .fav{width:13px;height:13px}
.mini.past{opacity:.6}
.mini.x b{text-decoration:line-through}
.wcol .none{color:var(--on-surface-var);font-size:12px;text-align:center;padding:16px 0;border:1px dashed var(--outline-var);border-radius:14px}
.wlist{display:none}

/* ---------- month heatmap ---------- */
.mdow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px}
.mdow div{font-size:11.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--on-surface-var);padding:0 10px}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mcell{border:0;min-width:0;min-height:112px;border-radius:16px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px;color:var(--on-surface);
  background:color-mix(in oklab,var(--heat) var(--h,0%),var(--surface-c-low));transition:transform .25s var(--ease),box-shadow .25s}
.mcell:hover{transform:translateY(-2px);box-shadow:var(--shadow-1)}
.mcell.hot{color:var(--on-heat)}
.mcell .top{display:flex;align-items:baseline;gap:6px}
.mcell .dn{font:850 24px/1 var(--font);font-stretch:75%}
.mcell .cnt{margin-left:auto;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;opacity:.85}
.mcell.out{opacity:.4}
.mcell.today{box-shadow:inset 0 0 0 2.5px var(--primary)}
.mcell.hot.today{box-shadow:inset 0 0 0 2.5px var(--surface),0 0 0 2px var(--primary)}
.mcell.sel{outline:2px dashed var(--outline);outline-offset:2px}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--ka);box-shadow:0 0 0 1.5px var(--surface-c-lowest)}
.mcell .tl{font-size:11.5px;line-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.9;display:flex;align-items:center;gap:5px}
.mcell .tl i{width:6px;height:6px;border-radius:3px;background:var(--ka);flex:none;box-shadow:0 0 0 1px var(--surface-c-lowest)}
.legend{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:12px;color:var(--on-surface-var);font-size:12px}
.legend i{width:18px;height:12px;border-radius:4px;background:color-mix(in oklab,var(--heat) var(--h),var(--surface-c-low))}

/* ---------- footer ---------- */
.foot-page{color:var(--on-surface-var);font-size:12.5px;padding:24px 0 40px;border-top:1px solid var(--outline-var);display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.foot-page kbd{margin:0 2px}

/* ---------- dialog / bottom sheet ---------- */
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;color:var(--on-surface);overflow:visible}
dialog::backdrop{background:var(--scrim);animation:fade .3s var(--ease)}
dialog.closing::backdrop{animation:fade .2s var(--ease-acc) reverse both}
dialog[open]{position:fixed;inset:0;margin:auto}
.sheet{width:min(680px,calc(100vw - 48px));max-height:min(90vh,900px);overflow:auto;overscroll-behavior:contain;background:var(--surface-c-low);border-radius:28px;
  animation:dlgIn .42s var(--ease-dec);box-shadow:0 24px 64px rgb(0 0 0 / .3);position:relative;scrollbar-width:thin}
dialog.closing .sheet{animation:dlgOut .2s var(--ease-acc) both}
@keyframes dlgIn{from{transform:translateY(24px) scale(.97);opacity:0}}
@keyframes dlgOut{to{transform:translateY(16px) scale(.98);opacity:0}}
@keyframes fade{from{opacity:0}}
.handle{display:none}
.hero{position:relative;height:300px;background:var(--ka);color:var(--koa);overflow:hidden;border-radius:28px 28px 0 0}
.hero .bg{position:absolute;inset:-20px;width:calc(100% + 40px);height:calc(100% + 40px);object-fit:cover;filter:blur(24px) saturate(1.2);opacity:.75}
.hero .fg{position:relative;display:block;height:100%;width:100%;object-fit:contain}
.hero.noimg{height:132px}
.hero:not(.noimg) .glyph{display:none}
dialog:focus,dialog:focus-visible,.sheet:focus{outline:none}
.hero .glyph{position:absolute;right:24px;bottom:-30px;font-size:180px;opacity:.18;font-variation-settings:"FILL" 1}
.closex{position:absolute;top:12px;right:12px;z-index:5;width:40px;height:40px;border-radius:20px;border:0;background:rgb(0 0 0 / .45);color:#fff;display:grid;place-items:center;
  backdrop-filter:blur(6px)}
.sbody{padding:20px 28px 8px}
.catrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.cat{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 10px 4px 8px;border-radius:9px;background:var(--k);color:var(--ko)}
.cat .ms{font-size:16px}
.sbody h2{margin:0 0 6px;font:800 30px/1.08 var(--font);font-stretch:85%;letter-spacing:-.2px;overflow-wrap:anywhere}
.sbody.x h2{text-decoration:line-through}
.info{display:grid;grid-template-columns:24px 1fr;gap:12px 14px;margin:18px 0;align-items:start}
.info>.ms{color:var(--on-surface-var);margin-top:1px}
.info>div{min-width:0;overflow-wrap:anywhere}
.info .sub{color:var(--on-surface-var);font-size:12.5px}
.info a{color:var(--on-surface);text-decoration-color:var(--outline);text-underline-offset:3px;font-weight:600}
.desc{white-space:pre-line;color:var(--on-surface);line-height:1.55;margin:0 0 18px;padding:14px 16px;border-radius:16px;background:var(--surface-c)}
.desc .more{display:flex;align-items:center;gap:4px;width:max-content;margin-top:10px;text-decoration:none;font-weight:700;color:var(--primary)}
.desc .more .ms{font-size:16px}
.desc a{color:var(--on-surface);text-decoration-color:var(--outline);text-underline-offset:3px;font-weight:600;overflow-wrap:anywhere}
.srcs{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.srcs a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--surface-c-lowest);text-decoration:none;color:var(--on-surface)}
.srcs a .fav{width:24px;height:24px;border-radius:6px}
.srcs a .fav.av{font-size:12px}
.srcs a div{min-width:0;flex:1}

<script>
"use strict";
// ================= constants & date helpers (defined before any state) =================
const TZ = "Europe/Warsaw";
const DOW = ["pon", "wt", "śr", "czw", "pt", "sob", "nd"];
const DOW_LONG = ["poniedziałek", "wtorek", "środa", "czwartek", "piątek", "sobota", "niedziela"];
const MONTHS = ["styczeń", "luty", "marzec", "kwiecień", "maj", "czerwiec", "lipiec", "sierpień", "wrzesień", "październik", "listopad", "grudzień"];
const MONTHS_GEN = ["stycznia", "lutego", "marca", "kwietnia", "maja", "czerwca", "lipca", "sierpnia", "września", "października", "listopada", "grudnia"];
const MON_SHORT = ["sty", "lut", "mar", "kwi", "maj", "cze", "lip", "sie", "wrz", "paź", "lis", "gru"];
const ICONS = {koncerty: "music_note", teatr: "theater_comedy", kino: "movie", sport: "sports_soccer", wystawy: "palette", dzieci: "child_care",
  spotkania: "forum", imprezy: "nightlife", festiwale: "festival", uroczystosci: "church", inne: "event", dlugie: "museum"};
const SHORT = {koncerty: "Koncerty", teatr: "Teatr i stand-up", kino: "Kino", sport: "Sport", wystawy: "Wystawy", dzieci: "Dzieci",
  spotkania: "Spotkania", imprezy: "Imprezy", festiwale: "Festiwale", uroczystosci: "Uroczystości", inne: "Inne"};

const fmtParts = new Intl.DateTimeFormat("sv-SE", {timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false});
function local(d) { const s = fmtParts.format(d); return {key: s.slice(0, 10), min: (+s.slice(11, 13) % 24) * 60 + +s.slice(14, 16)}; }
function todayKey() { return local(new Date()).key; }
function kd(k) { const [y, m, d] = k.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); }
function key(dt) { return dt.toISOString().slice(0, 10); }
function addDays(k, n) { const d = kd(k); d.setUTCDate(d.getUTCDate() + n); return key(d); }
function addMonths(k, n) { const d = kd(k); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + n); return key(d); }
function dow(k) { return (kd(k).getUTCDay() + 6) % 7; }
function weekStart(k) { return addDays(k, -dow(k)); }
function diffDays(a, b) { return Math.round((kd(b) - kd(a)) / 864e5); }
function hm(min) { return String(Math.floor(min / 60) % 24).padStart(2, "0") + ":" + String(min % 60).padStart(2, "0"); }
function dayNum(k) { return +k.slice(8); }
function mon(k) { return +k.slice(5, 7) - 1; }
function longDate(k) { return `${DOW_LONG[dow(k)]}, ${dayNum(k)} ${MONTHS_GEN[mon(k)]}`; }
function shortDate(k) { return `${dayNum(k)} ${MON_SHORT[mon(k)]}`; }
function rangeLabel(a, b) {
  if (a === b) return shortDate(a);
  return mon(a) === mon(b) ? `${dayNum(a)}–${dayNum(b)} ${MON_SHORT[mon(b)]}` : `${shortDate(a)} – ${shortDate(b)}`;
}
function* daysOf(a, b) { for (let k = a; k <= b; k = addDays(k, 1)) yield k; }
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const catVars = c => `--k:var(--k-${c});--ko:var(--ko-${c});--ka:var(--ka-${c});--koa:var(--koa-${c})`;
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const store = {
  get(k, d) { try { const v = localStorage.getItem("twc:" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("twc:" + k, JSON.stringify(v)); } catch { /* private mode */ } },
};

// ================= data =================
const CAL = window.CAL || {events: [], categories: {}, feeds: []};
const CATS = Object.keys(CAL.categories || SHORT);
function prepare(list) {
  for (const e of list) {
    e.c = (e.c && e.c.length ? e.c : ["inne"]).filter(c => ICONS[c]);
    if (!e.c.length) e.c = ["inne"];
    e.c0 = e.c.slice();   // categories as the source gave them; e.c / e.cat follow the filters (orderCats)
    e.cat = e.c[0];
    e.src = e.src && e.src.length ? e.src : [["?", "#"]];
    const s = local(new Date(e.s));
    e.sk = s.key; e.smin = e.ad ? 0 : s.min;
    e.sMs = Date.parse(e.s);
    if (e.ad) {
      // iCal all-day end is exclusive.
      const ek = e.e ? local(new Date(e.e)).key : e.sk;
      e.ek = e.e && ek > e.sk ? addDays(ek, -1) : e.sk;
      e.emin = 1440; e.eMs = Date.parse(e.ek + "T23:59:59");
      e.multi = e.ek > e.sk;
    } else if (e.e) {
      const en = local(new Date(e.e));

document.getElementById("sOpen").onclick = () => { bar.classList.add("searching"); q.focus(); };
q.addEventListener("blur", () => { if (!q.value) bar.classList.remove("searching"); });
q.addEventListener("keydown", ev => { if (ev.key === "Escape") { clearSearch(); q.blur(); bar.classList.remove("searching"); } });

// ================= wiring =================
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => { if (state.q) clearSearch(false); setView(b.dataset.v); });
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
document.getElementById("todayBtn").onclick = goToday;
document.querySelectorAll(".qchip").forEach(b => b.onclick = () => {
  const T = todayKey();
  if (b.dataset.q === "today") goRange(T, T);
  else if (b.dataset.q === "tomorrow") goRange(addDays(T, 1), addDays(T, 1));
  else { const [a, c] = weekendRange(); goRange(a, c); }
});
// Horizontal strips (days, chips on phones, rails): a vertical mouse wheel scrolls them sideways,
// so nothing is reachable only by touch or shift+wheel.
function wheelSideways(el) {
  el.addEventListener("wheel", ev => {
    if (el.scrollWidth <= el.clientWidth + 1 || Math.abs(ev.deltaX) > Math.abs(ev.deltaY)) return;
    const max = el.scrollWidth - el.clientWidth;
    if ((ev.deltaY < 0 && el.scrollLeft <= 0) || (ev.deltaY > 0 && el.scrollLeft >= max - 1)) return;  // let the page scroll
    ev.preventDefault();
    el.scrollLeft += ev.deltaY;
  }, {passive: false});
  const edge = () => el.classList.toggle("at-end", el.scrollLeft >= el.scrollWidth - el.clientWidth - 2);
  el.addEventListener("scroll", edge, {passive: true}); addEventListener("resize", edge); setTimeout(edge, 300);
}
["days", "cats"].forEach(id => wheelSideways(document.getElementById(id)));
document.querySelectorAll(".rail").forEach(wheelSideways);
new MutationObserver(() => document.querySelectorAll(".rail:not([data-wheel])").forEach(r => { r.dataset.wheel = 1; wheelSideways(r); }))
  .observe(document.getElementById("main") || document.body, {childList: true, subtree: true});
function paintWhere() {
  document.querySelectorAll("#where button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.w === state.where)));
}
document.getElementById("where").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b || b.dataset.w === state.where) return;
  state.where = b.dataset.w; store.set("where", state.where); paintWhere();
  refreshStripCounts();
  render("zoom");
});
paintWhere();
document.getElementById("cats").addEventListener("click", ev => {
  const b = ev.target.closest(".chip"); if (!b) return;
  const c = b.dataset.c;
  state.off.has(c) ? state.off.delete(c) : state.off.add(c);
  store.set("off", [...state.off]);
  refreshStripCounts();
  render("zoom");
});
// delegated clicks: events, days, inline actions
document.addEventListener("click", ev => {
  if (ev.target.closest("dialog")) return;
  const idEl = ev.target.closest("[data-id]");
  if (idEl) { openEvent(idEl.dataset.id); return; }
  const dayEl = ev.target.closest("[data-day]");
  if (dayEl) { goRange(dayEl.dataset.day, dayEl.dataset.day); if (!dayEl.classList.contains("dchip")) scrollToContent(); return; }
  const act = ev.target.closest("[data-act]");
  if (!act) return;
  if (act.dataset.act === "showlong") { state.off.delete("wystawy"); store.set("off", [...state.off]); refreshStripCounts(); render("zoom"); }
  else if (act.dataset.act === "tomorrow") { const t = addDays(todayKey(), 1); goRange(t, t); }
  else if (act.dataset.act === "togglepast") {
    const sec = act.closest(".sec"), open = state.pastOpen = sec.classList.contains("closed");
    sec.classList.toggle("closed", !open);
    sec.nextElementSibling.classList.toggle("closed", !open);
    act.setAttribute("aria-expanded", String(open));
    act.lastChild.textContent = open ? "Zwiń" : "Pokaż";
  }
});
addEventListener("keydown", ev => {
  if (ev.target.closest("input,textarea") || dlg.open || mapDlg.open || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const k = ev.key;
  if (k === "ArrowLeft") step(-1); else if (k === "ArrowRight") step(1);
  else if (k === "t") goToday();
  else if (k === "p") openMap();
  else if (k === "d") setView("day"); else if (k === "w") setView("week"); else if (k === "m") setView("month");
  else if (k === "/") { ev.preventDefault(); bar.classList.add("searching"); q.focus(); }
  else return;
});
// swipe left/right on the content (not on horizontal rails)
let tx = null, ty = 0;
host.addEventListener("touchstart", e => { if (e.target.closest(".rail")) { tx = null; return; } tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive: true});
host.addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) step(dx < 0 ? 1 : -1);
});
addEventListener("scroll", () => bar.classList.toggle("lifted", scrollY > 4), {passive: true});
let rT, lastW = innerWidth;
addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => { if (Math.abs(innerWidth - lastW) > 40 && state.view === "month") { lastW = innerWidth; current?.remove(); current = null; render(); } }, 200); });
addEventListener("hashchange", () => {
  const h = readHash(); if (!h) return;
  if (h.ev) openEvent(h.ev, true);
  else if (h.weekend) { const [a, b] = weekendRange(); goRange(a, b); }
  else { if (dlg.open) closeDlg(); if (h.from) { state.from = h.from; state.to = h.to; } setView(h.view); render("zoom"); }
});
// Refresh "teraz / za 2 h" hints every minute.
setInterval(() => { if (state.view === "day" && state.from === todayKey() && !dlg.open) { const y = scrollY; current?.remove(); current = null; render(); scrollTo(0, y); } }, 60000);

// ================= map of the period's events =================
// MapLibre GL + OpenFreeMap vector tiles (OpenStreetMap data): free, no API key, no cookies.
// The library (~800 kB) is fetched on first use only. "liberty" reads like Google Maps (yellow main roads,
// green parks, buildings); "fiord" is its dark counterpart with roads that stand out from the blocks.
const mapDlg = document.getElementById("mapDlg"), mapCard = document.getElementById("mapCard"), mapMsg = document.getElementById("mapMsg");
const MAPLIBRE = "https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min";
const mapStyle = dark => `https://tiles.openfreemap.org/styles/${dark ? "fiord" : "liberty"}`;
const TARNOW = [20.9883, 50.0125];  // Rynek, [lon, lat]
let mapLib = null, map = null, mapDark = null, mapPins = [];
// Liberty is pale (near-white land, see-through greens). This palette makes the town look like spring and
// closer to Google Maps: tinted land and buildings so white and yellow roads pop, rich greens, deep blue water.
const SPRING = {
  background: {"background-color": "#e9e5d9"},                       // warm sand instead of paper white
  landuse_residential: {"fill-color": "hsla(36,42%,82%,0.6)"},
  building: {"fill-color": "#d8cdbb"},
  "building-3d": {"fill-extrusion-color": "#d8cdbb"},
  park: {"fill-color": "#9fd98a", "fill-opacity": 1, "fill-outline-color": "#7cc566"},
  park_outline: {"line-color": "#86cd70"},
  landcover_wood: {"fill-color": "#86c96c", "fill-opacity": 0.9},
  landcover_grass: {"fill-color": "#ace08f", "fill-opacity": 0.9},
  landuse_pitch: {"fill-color": "#94d47e"},
  landuse_track: {"fill-color": "#94d47e"},
  landuse_cemetery: {"fill-color": "#a9d494"},
  landuse_school: {"fill-color": "#efe1ac"},
  landuse_hospital: {"fill-color": "#f6c9d6"},
  landcover_sand: {"fill-color": "#f2e09e"},
  aeroway_fill: {"fill-color": "#dad6ca"},
  water: {"fill-color": "#4f9fe3"},
  waterway_river: {"line-color": "#4f9fe3"},
  waterway_other: {"line-color": "#4f9fe3"},
  waterway_tunnel: {"line-color": "#4f9fe3"},
  water_name_point_label: {"text-color": "#1d5c99"},
  water_name_line_label: {"text-color": "#1d5c99"},
  waterway_line_label: {"text-color": "#1d5c99"},
};
function tuneMap() {
  if (map.getLayer("poi_transit")) map.setLayoutProperty("poi_transit", "visibility", "none");  // bus stops compete with the pins
  if (mapDark) return;
  for (const [id, paint] of Object.entries(SPRING))
    if (map.getLayer(id)) for (const [k, v] of Object.entries(paint)) map.setPaintProperty(id, k, v);
}
function isDark() { return state.theme === "dark" || (state.theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches); }
function loadMapLib() {
  return mapLib ||= new Promise((ok, fail) => {
    const css = Object.assign(document.createElement("link"), {rel: "stylesheet", href: MAPLIBRE + ".css"});
    const js = Object.assign(document.createElement("script"), {src: MAPLIBRE + ".js"});
    js.onload = () => ok(window.maplibregl);
    js.onerror = () => { mapLib = null; js.remove(); fail(new Error("maplibre")); };
    document.head.append(css, js);
  });
}
function syncMapStyle() {
  if (!map) return;
  const d = isDark();
  if (d !== mapDark) { mapDark = d; map.setStyle(mapStyle(d)); }
}
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", syncMapStyle);
// What the list shows (period, place filter, categories, search), grouped by map point.
function mapData() {
  const [a, b] = state.q ? [todayKey(), todayKey()] : periodRange();
  const evs = EVENTS.filter(e => overlaps(e, a, b) && visible(e))
    .sort((x, y) => x.sk < y.sk ? -1 : x.sk > y.sk ? 1 : x.smin - y.smin);
  const byPt = new Map();
  for (const e of evs) {
    if (!e.geo) continue;
    const k = e.geo[0].toFixed(4) + "," + e.geo[1].toFixed(4);
    if (!byPt.has(k)) byPt.set(k, {geo: e.geo, evs: []});
    byPt.get(k).evs.push(e);
  }
  const top = xs => { const n = {}; let best = null; for (const x of xs) if (x && (n[x] = (n[x] || 0) + 1) > (n[best] || 0)) best = x; return best; };
  const places = [...byPt.values()].map(p => ({...p, cat: top(p.evs.map(e => e.cat)) || "inne",
    name: top(p.evs.map(e => e.loc)) || top(p.evs.map(e => e.town)) || "Miejsce"}));
  return {a, b, total: evs.length, noGeo: evs.filter(e => !e.geo).length, places};
}
function mapTimeLbl(e, a, b) {
  if (e.ad || inBox(e)) return e.ek > b ? `do ${shortDate(e.ek)}` : e.multi ? `${shortDate(e.sk)}–${shortDate(e.ek)}` : "cały dzień";
  return (a !== b ? DOW[dow(e.sk)] + " " + dayNum(e.sk) + " · " : "") + hm(e.smin);
}
function showPlace(p, pin, d) {
  mapPins.forEach(m => m.getElement().firstChild.classList.toggle("on", m.getElement().firstChild === pin));
  const groups = new Map();  // a cinema's screenings of one film share a row with all their times
  for (const e of p.evs) { if (!groups.has(e.t)) groups.set(e.t, []); groups.get(e.t).push(e); }
  mapCard.innerHTML = `<div class="mc-h"><span class="ms">location_on</span><div><b>${esc(p.name)}</b><small>${p.evs.length} ${plural(p.evs.length)}</small></div>
    <button class="icon-btn sl" data-act="cardclose" aria-label="Zamknij"><span class="ms">close</span></button></div>` +
    [...groups].map(([t, list]) => `<div class="mc-ev" style="${catVars(list[0].cat)}"><span class="ms mc-i" aria-hidden="true">${ICONS[list[0].cat] || "event"}</span>
      <div><button class="mc-t" data-mid="${esc(list[0].id)}">${esc(t)}</button>
      <div class="mc-times">${list.map(e => `<button data-mid="${esc(e.id)}">${esc(mapTimeLbl(e, d.a, d.b))}</button>`).join("")}</div></div></div>`).join("");
  mapCard.hidden = false;
  mapCard.scrollTop = 0;
}
function closePlace() { mapCard.hidden = true; mapPins.forEach(m => m.getElement().firstChild.classList.remove("on")); }
function drawPins(d) {
  const ml = window.maplibregl;
  mapPins.forEach(m => m.remove()); mapPins = [];
  closePlace();
  const bounds = new ml.LngLatBounds();
  // Busiest places last, so their pins sit on top.
  for (const p of [...d.places].sort((x, y) => x.evs.length - y.evs.length)) {
    const wrap = document.createElement("div"); wrap.className = "mpin";  // MapLibre positions the wrapper; the pin can scale
    const n = p.evs.length;
    wrap.innerHTML = `<button class="pin" style="${catVars(p.cat)}" aria-label="${esc(p.name)}: ${n} ${plural(n)}" title="${esc(p.name)}">
      <span class="ms" aria-hidden="true">${ICONS[p.cat] || "event"}</span>${n > 1 ? `<b>${n}</b>` : ""}</button>`;
    wrap.firstChild.addEventListener("click", ev => { ev.stopPropagation(); showPlace(p, wrap.firstChild, d); });
    mapPins.push(new ml.Marker({element: wrap, anchor: "center"}).setLngLat([p.geo[1], p.geo[0]]).addTo(map));
    bounds.extend([p.geo[1], p.geo[0]]);
  }
  if (d.places.length) map.fitBounds(bounds, {padding: {top: 64, bottom: 64, left: 56, right: 56}, maxZoom: 14, duration: 0});
  else map.jumpTo({center: TARNOW, zoom: 9.5});
}
async function openMap() {
  const d = mapData();
  const [a, b] = [d.a, d.b];
  document.getElementById("mapTitle").textContent = state.q ? `Dziś: „${state.q}”`
    : a === b ? `${a === todayKey() ? "Dziś, " : ""}${DOW_LONG[dow(a)]} ${dayNum(a)} ${MONTHS_GEN[mon(a)]}` : rangeLabel(a, b);
  const places = d.places.length;
  document.getElementById("mapSub").textContent = `${d.total} ${plural(d.total)} · ${places} ${places === 1 ? "miejsce" : places % 10 >= 2 && places % 10 <= 4 && (places % 100 < 12 || places % 100 > 14) ? "miejsca" : "miejsc"}`
    + (d.noGeo ? ` · ${d.noGeo} bez lokalizacji` : "");
  mapDlg.classList.remove("closing");
  if (!mapDlg.open) mapDlg.showModal();
  mapMsg.hidden = !!map; mapMsg.textContent = "Wczytywanie mapy…";
  try { await loadMapLib(); }
  catch { mapMsg.hidden = false; mapMsg.textContent = "Nie udało się wczytać mapy – sprawdź połączenie z internetem."; return; }
  const ml = window.maplibregl;
  if (!map) {
    mapDark = isDark();
    map = new ml.Map({container: "map", style: mapStyle(mapDark), center: TARNOW, zoom: 10, attributionControl: false,
                      dragRotate: false, pitchWithRotate: false, touchPitch: false, cooperativeGestures: false});
    map.touchZoomRotate.disableRotation();
    map.addControl(new ml.NavigationControl({showCompass: false}), "top-right");
    map.addControl(new ml.AttributionControl({compact: true}), "bottom-right");
    map.on("click", closePlace);
    map.on("style.load", tuneMap);
    map.once("load", () => { mapMsg.hidden = true; });
  } else syncMapStyle();
  map.resize();
  drawPins(d);
  if (!d.total) { mapMsg.hidden = false; mapMsg.textContent = "Brak wydarzeń w tym okresie."; }
  else if (!places) { mapMsg.hidden = false; mapMsg.textContent = "Żadne z wydarzeń nie ma lokalizacji na mapie."; }
}
function closeMap() {
  if (!mapDlg.open || mapDlg.classList.contains("closing")) return;
  const fin = () => { mapDlg.classList.remove("closing"); mapDlg.close(); };
  if (reduced()) fin(); else { mapDlg.classList.add("closing"); setTimeout(fin, 210); }
}
document.getElementById("mapBtn").onclick = openMap;
mapDlg.addEventListener("cancel", ev => { ev.preventDefault(); closeMap(); });
mapDlg.addEventListener("click", ev => {
  if (ev.target === mapDlg) return closeMap();
  const m = ev.target.closest("[data-mid]");
  if (m) return openEvent(m.dataset.mid);
  const act = ev.target.closest("[data-act]")?.dataset.act;
  if (act === "mapclose") closeMap(); else if (act === "cardclose") closePlace();
});

// ================= boot =================
try {
  document.fonts.load('20px "Material Symbols Rounded"', "search").then(f => { if (f.length) document.documentElement.classList.add("icons"); });
  document.fonts.ready.then(() => { if (document.fonts.check('20px "Material Symbols Rounded"', "search")) document.documentElement.classList.add("icons"); });
} catch { document.documentElement.classList.add("icons"); }
applyTheme();
{
  const g = CAL.generated ? new Date(CAL.generated) : null;
  const gs = g ? g.toLocaleString("pl-PL", {timeZone: TZ, day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"}) : "";
  document.getElementById("sub").innerHTML = `<span>${EVENTS.length} wydarzeń</span><span class="sub-txt"> · Tarnów i 50 km</span>`;
  document.getElementById("gen").textContent = g ? `Aktualizacja: ${gs}` : "";
  const h = readHash();
  let openId = null;
  if (h?.ev) { openId = h.ev; const e = BY_ID.get(openId); if (e) { state.view = "day"; state.from = state.to = e.sk < T0 && e.ek >= T0 ? T0 : e.sk; } }
  else if (h?.weekend) { [state.from, state.to] = weekendRange(); state.view = "day"; }
  else if (h?.view) { state.view = h.view; if (h.from) { state.from = h.from; state.to = h.view === "day" ? h.to : h.from; } }
  if (!HASH[state.view]) state.view = "day";
  renderChips(true);
  render();
  if (openId) { suppressHash = true; openEvent(openId, true); suppressHash = false; }
}
</script>
