# Daily build at 12:00 Polish time: fetch every source, write the .ics feeds, publish on GitHub Pages.
# Free for public repos. Feeds end up at https://<user>.github.io/<repo>/wszystkie.ics
name: build-feeds

on:
  schedule:
    # Cron is UTC-only. 12:00 in Warsaw is 10:00 UTC in summer (CEST) and 11:00 UTC in winter (CET):
    # both fire, and the gate job below lets through only the one that is noon in Warsaw.
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["sources.yaml", "src/**", ".github/workflows/build.yml"]

# Third-party actions are pinned to commit SHAs: a moved tag cannot inject code into the
# job that holds GEMINI_API_KEY. The key is passed only to the 'Build feeds' step.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        # Decided by which cron fired, not by the clock, so a delayed scheduled run still counts.
        run: |
          offset=$(TZ=Europe/Warsaw date +%z)
          case "${{ github.event_name }}/${{ github.event.schedule }}/$offset" in
            schedule/"0 10 * * *"/+0200|schedule/"0 11 * * *"/+0100) echo run=true ;;
            schedule/*) echo run=false ;;
            *) echo run=true ;;  # manual run or push
          esac >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e '.[dev]'
      - run: pytest -q

      # AI answers and geocodes are cached by content hash: unchanged pages cost nothing.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: cache
          key: te-cache-${{ github.run_id }}
          restore-keys: te-cache-

      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # UID state lives next to the feeds; pull yesterday's so calendar apps see updates,
      # not delete+create, when an event is merged with a newly found duplicate.
      - name: Restore UID state
        run: |
          mkdir -p public
          curl -fsSL "${{ steps.pages.outputs.base_url }}/state.json" -o public/state.json || echo '{"uids":{}}' > public/state.json

      - name: Build feeds
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Max Gemini requests per day (Settings → Secrets and variables → Actions → Variables).
          TE_AI_DAILY_LIMIT: ${{ vars.TE_AI_DAILY_LIMIT || '60' }}
          TE_PUBLIC_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: tarnow-events run

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
