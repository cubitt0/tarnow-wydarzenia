# Daily build: fetch every source, write the .ics feeds, publish them on GitHub Pages.
# Free for public repos. Feeds end up at https://<user>.github.io/<repo>/wszystkie.ics
name: build-feeds

on:
  schedule:
    - cron: "15 */6 * * *" # every 6 h; AI only re-reads pages that changed
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["sources.yaml", "src/**", ".github/workflows/build.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e '.[dev]'
      - run: pytest -q

      # AI answers and geocodes are cached by content hash: unchanged pages cost nothing.
      - uses: actions/cache@v4
        with:
          path: cache
          key: te-cache-${{ github.run_id }}
          restore-keys: te-cache-

      - id: pages
        uses: actions/configure-pages@v5

      # UID state lives next to the feeds; pull yesterday's so calendar apps see updates,
      # not delete+create, when an event is merged with a newly found duplicate.
      - name: Restore UID state
        run: |
          mkdir -p public
          curl -fsSL "${{ steps.pages.outputs.base_url }}/state.json" -o public/state.json || echo '{"uids":{}}' > public/state.json

      - name: Build feeds
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TE_PUBLIC_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: tarnow-events run

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
